<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bike Tracker</title>
  <style>html, body { background: #020617; color: #f1f5f9; color-scheme: dark; margin: 0; }</style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- Loads App.jsx as-is, compiles the JSX in the browser and mounts it. No build step. -->
  <script type="module">
    const root = document.getElementById('root');
    try {
      const src = await (await fetch('./App.jsx', { cache: 'no-cache' })).text();
      const mount = `
import { createRoot as __createRoot } from 'react-dom/client';
__createRoot(document.getElementById('root')).render(<App />);`;
      const { code } = Babel.transform(src + mount, {
        presets: [['react', { runtime: 'automatic' }]],
        filename: 'App.jsx',
      });
      await import(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
    } catch (err) {
      root.innerHTML = '<pre style="padding:16px;white-space:pre-wrap;color:#fda4af"></pre>';
      root.firstChild.textContent = 'Could not load the app:\n' + err;
      console.error(err);
    }
  </script>
</body>
</html>
